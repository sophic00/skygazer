name: Update Blogroll Feed

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual execution from the GitHub Actions tab

permissions:
  contents: write         # Allows the job to push commits to the repository

concurrency:
  group: update-blogroll
  cancel-in-progress: true  # Never let a manual run race the nightly cron on git push

jobs:
  update-blogroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Run RSS updater script
        run: uv run update_blogroll.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blogroll.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in blogroll data."
          else
            git commit -m "chore: update blogroll feeds [skip ci]"
            git push
          fi

{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ super() }}{% endblock %}

{% block main %}
  <h1>{{ page.title }}</h1>
  {%- if page.date and not page.extra.menu %}
    <p>
      <i>
        <time datetime="{{ page.date | date(format='%+') }}">
          {{- page.date | date(format=config.extra.date_format) -}}
        </time>
      </i>
    </p>
  {%- endif %}
  <main>
    {{ page.content | safe }}
  </main>
{% endblock %}
